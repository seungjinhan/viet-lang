  <text x="437" y="104" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" fill="#fff">Xin chào!</text>

  <rect width="600" height="600" filter="url(#paper)" opacity=".28"/>
